[global]
   workgroup = WORKGROUP
   server string = ProDesk Server
   server role = standalone server

   # Log
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   # Sicurezza autenticazione
   security = user
   map to guest = never
   
   # Restrizione di rete — LAN IPv4/IPv6 e Tailscale
   hosts allow = 127.0.0.1 ::1 192.168.1.0/24 100.64.0.0/10 fd00::/64 fe80::/10 2a01:e11:2009:d1d0::/64 fd7a:115c:a1e0::/48
   hosts deny = ALL

   # Disabilita NetBIOS (porta 139 legacy)
   disable netbios = yes
   smb ports = 445

   # Forza SMB2/3 — disabilita SMB1
   server min protocol = SMB2
   server max protocol = SMB3

   # Cifratura obbligatoria SMB3
   smb encrypt = required

   # Firma pacchetti — protezione da attacchi MITM
   server signing = mandatory

   # Utenti validi — solo ubermensch può autenticarsi
   valid users = ubermensch

   # Performance e modern transfer
   server multi channel support = yes
   aio read size = 1
   aio write size = 1
   deadtime = 15

   # Ottimizzazione per client Apple / macOS / iOS
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = Macmini
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[Scaricati]
   comment = Cartella Multimediale Plex / Transmission
   path = /home/ubermensch/Scaricati
   browseable = yes
   read only = no
   guest ok = no
   valid users = ubermensch
   force user = ubermensch
   force group = ubermensch
   create mask = 0664
   directory mask = 0775

[Home-ProDesk]
   comment = Home di Ubermensch su ProDesk
   path = /home/ubermensch
   browseable = no
   read only = no
   guest ok = no
   valid users = ubermensch
   create mask = 0644
   directory mask = 0755
   force user = ubermensch
