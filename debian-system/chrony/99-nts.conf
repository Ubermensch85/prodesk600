# Network Time Security (NTS - RFC 8915, TLS 1.3) — NTP cifrato e autenticato
# Evita manipolazioni dell'orologio di sistema (critico per DNSSEC e TLS 1.3)
server time.cloudflare.com iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server nts.netnod.se iburst nts

# Persistenza cookie NTS tra i riavvii
ntsdumpdir /var/lib/chrony
minsources 2
