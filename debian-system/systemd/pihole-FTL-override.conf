[Unit]
After=network-online.target systemd-timesyncd.service dnsproxy.service tailscaled.service
Wants=network-online.target tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do ip route get 100.100.100.100 2>/dev/null | grep -q "dev tailscale0" && exit 0; sleep 0.5; done; exit 0'
